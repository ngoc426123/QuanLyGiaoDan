<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Bảo vệ dữ liệu</title>
    <style>
      body {
        box-sizing: border-box;
        height: 100vh;
        margin: 0;
        padding: 32px;
        overflow: hidden;
        color: #1f2d2b;
        background: #f3f5f5;
        font:
          16px/1.5 'Segoe UI Variable',
          'Segoe UI',
          system-ui,
          sans-serif;
      }
      main {
        box-sizing: border-box;
        width: min(100%, 560px);
        margin: 0 auto;
        padding: 24px;
        border: 1px solid #d7dfdd;
        border-radius: 4px;
        background: #ffffff;
        box-shadow: 0 12px 32px #1727243d;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 600;
        line-height: 1.5;
      }
      p {
        margin: 0;
      }
      label {
        display: block;
        margin-top: 16px;
        font-weight: 600;
      }
      [hidden] {
        display: none !important;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        height: 34px;
        margin-top: 4px;
        padding: 0 8px;
        border: 1px solid #a8b4b2;
        border-radius: 4px;
        font: inherit;
      }
      input:focus {
        border-color: #236b5a;
        outline: 0;
        box-shadow: 0 0 0 2px #236b5a42;
      }
      button {
        min-height: 34px;
        margin-top: 24px;
        padding: 6px 16px;
        border: 0;
        border-radius: 4px;
        background: #236b5a;
        color: white;
        font: inherit;
        font-weight: 600;
      }
      button:hover {
        background: #1c584a;
      }
      button:focus-visible {
        outline: 0;
        box-shadow: 0 0 0 2px #236b5a42;
      }
      .error {
        margin-top: 16px;
        min-height: 1.5em;
        color: #ae3039;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title"></h1>
      <p id="description"></p>
      <p class="error" id="error" role="alert"></p>
      <form>
        <label
          >Mật khẩu dữ liệu<input id="password" type="password" minlength="12" required autofocus
        /></label>
        <label id="confirmation-label"
          >Xác nhận mật khẩu<input id="confirmation" type="password" minlength="12" required
        /></label>
        <button id="submit" type="submit"></button>
      </form>
    </main>
    <script>
      const params = new URLSearchParams(location.search)
      const setup = params.get('setup') === '1'
      const password = document.querySelector('#password')
      const confirmation = document.querySelector('#confirmation')
      const error = document.querySelector('#error')
      document.querySelector('#title').textContent = setup
        ? 'Đặt mật khẩu dữ liệu'
        : 'Mở dữ liệu giáo xứ'
      document.querySelector('#description').textContent = setup
        ? 'Mật khẩu này mã hóa cơ sở dữ liệu. Không thể khôi phục dữ liệu nếu quên mật khẩu.'
        : 'Nhập mật khẩu để mở dữ liệu đã mã hóa.'
      error.textContent = params.get('message') || ''
      document.querySelector('#confirmation-label').hidden = !setup
      confirmation.required = setup
      password.autocomplete = setup ? 'new-password' : 'current-password'
      document.querySelector('#submit').textContent = setup
        ? 'Đặt mật khẩu và mở ứng dụng'
        : 'Mở ứng dụng'
      document.querySelector('form').addEventListener('submit', async (event) => {
        event.preventDefault()
        if (password.value.length < 12)
          return (error.textContent = 'Mật khẩu phải có ít nhất 12 ký tự.')
        if (setup && password.value !== confirmation.value)
          return (error.textContent = 'Hai mật khẩu không khớp.')
        const result = await window.encryption.unlock({
          password: password.value,
          confirmation: confirmation.value,
        })
        if (!result.ok) error.textContent = result.message
      })
    </script>
  </body>
</html>
